title: PHP Worker Segfault or Memory Exhaustion
name: php_worker_crash
status: experimental
description: >
  A PHP worker died on SIGSEGV or hit memory_limit. Both are side effects of
  the PHP2Shell memory corruption bugs (CVE-2026-109618, CVE-2026-109619).
  A single event is common noise; see the correlation rule below.
author: M3RICK
date: 2026-10-29
logsource:
  product: linux
  service: php-fpm # custom: php-fpm and Apache error logs
detection:
  keywords:
    - 'exited on signal 11'             # php-fpm master log
    - 'exit signal Segmentation fault'  # Apache mod_php (AH00052)
    - 'Allowed memory size of'          # memory_limit reached
  condition: keywords
level: low
---
title: PHP Worker Crash Burst
status: experimental
description: Repeated PHP worker crashes on the same host in a short window.
author: M3RICK
date: 2026-10-29
correlation:
  type: event_count
  rules:
    - php_worker_crash
  group-by:
    - host
  timespan: 5m
  condition:
    gte: 5
level: high
